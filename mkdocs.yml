site_name: Notes
site_url: https://alanjojo.github.io/
site_dir: site
site_author: Alan Jojo
site_description: Notes on Catechism, Theology

# Configuration
theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections

# Plugins
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

# Extensions
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      title: Contents
      permalink: true

# Additional CSS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - extra.js
  - iisc.js

# Page tree
nav:
  - Home: index.md
  - Posts: posts.md
  - BIY: biy.md
  - CIY: ciy.md